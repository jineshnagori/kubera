site_name: KubeRA
site_description: Kubernetes Resource Allocator — vertical-first, HPA-cooperative autoscaling with in-place Pod resize
site_url: https://kubera.jineshnagori.in
repo_url: https://github.com/jineshnagori/kubera
repo_name: jineshnagori/kubera

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - DynamicResource Reference: dynamicresource.md
  - HPA Coordination: hpa-coordination.md
  - Architecture: architecture.md
  - Observability: observability.md
  - Troubleshooting: troubleshooting.md
