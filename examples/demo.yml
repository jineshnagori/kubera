# KubeRA end-to-end demo: vertical-first (KubeRA) -> horizontal takeover (HPA).
#
# Story:
#   idle    -> KubeRA shrinks CPU/memory toward min
#   load in -> KubeRA grows CPU in place, step-capped, up to cpu.max (400m)
#   still under load at max -> hpaState: AtMaxVertical -> HPA scales replicas
#   load out -> HPA scales replicas down first, then KubeRA shrinks back
#
# Apply:   kubectl apply -f demo.yml
# Load:    see the curl loop at the bottom of this file (run IN-cluster)
# Watch:   kubectl get pods -l app=demo-api -w \
#            -o custom-columns='POD:.metadata.name,CPU:.spec.containers[0].resources.requests.cpu,MEM:.spec.containers[0].resources.requests.memory,RESTARTS:.status.containerStatuses[0].restartCount'
#          kubectl get dynamicresource demo-api-policy -w
#          kubectl get hpa demo-api-hpa -w

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels: { app: demo-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: demo-api } }
  template:
    metadata: { labels: { app: demo-api } }
    spec:
      containers:
      - name: app
        # Canonical Kubernetes HPA demo image: serves HTTP and burns CPU
        # proportional to request rate (idle nginx would never move under
        # a curl loop, so it can't demonstrate scaling).
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resizePolicy:                     # required for in-place resize
        - { resourceName: cpu,    restartPolicy: NotRequired }
        - { resourceName: memory, restartPolicy: NotRequired }
        resources:
          # Burstable (limit > request): CPU/memory requests can shrink
          # fully in-place. Guaranteed (request == limit) would need
          # InPlaceOrRecreate + the pod webhook to ever shrink memory.
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 200m, memory: 256Mi }

---

apiVersion: v1
kind: Service
metadata:
  name: demo-api
  labels: { app: demo-api }
spec:
  selector: { app: demo-api }
  ports:
  - port: 80
    targetPort: 80

---

# HPA takes over once KubeRA pins CPU at its configured max (below) and
# usage is still above target. Needs metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  behavior:                    # fast for a demo; use slower stabilization in prod
    scaleUp:
      stabilizationWindowSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60

---

apiVersion: autoscaling.kubera.io/v1alpha1
kind: DynamicResource
metadata:
  name: demo-api-policy
spec:
  selector:
    matchLabels: { app: demo-api }
  updateMode: "InPlaceOrRecreate"
  resources:
    cpu:    { min: 50m,  max: 400m }    # max kept under HPA's per-pod ceiling
    memory: { min: 64Mi, max: 256Mi }   # so AtMaxVertical is reachable in a demo
  metrics:
    provider: MetricsServer
    pollingInterval: 15s               # fast for a demo; default 30s in prod
    cpuPercentile: 90
    memoryPercentile: 95
  behavior:
    scaleUp:
      stabilizationWindow: 30s
      maxStepPercent: 50                # no sudden jumps
      cooldown: 30s                     # shortened for the demo (default 2m)
    scaleDown:
      stabilizationWindow: 30s
      maxStepPercent: 20
      cooldown: 30s                     # shortened for the demo (default 10m)
  hpa:
    mode: Cooperative
    reserveHeadroomPercent: 10
    pauseWhileHPAScaling: true
    cooldownAfterHPA: 2m                 # shortened for the demo (default 10m)

---

# --- Load test ---------------------------------------------------------
# demo-api is a ClusterIP Service: its DNS name only resolves INSIDE the
# cluster. Run the loop from a pod, not your Mac terminal.
#
# kubectl run load-gen --rm -it --restart=Never --image=curlimages/curl -- \
#   sh -c 'for i in $(seq 1 10000); do
#     curl -s -o /dev/null -w "%{http_code}\n" http://demo-api/
#     sleep 0.0001
#   done | sort | uniq -c'
#
# Repeat the command (or wrap it in a while-loop) to sustain load long
# enough to see: KubeRA grow CPU -> pin at 400m -> hpaState: AtMaxVertical
# -> HPA add replicas. Stop running it and watch the reverse: HPA scales
# down first, then KubeRA shrinks CPU back toward 50m.